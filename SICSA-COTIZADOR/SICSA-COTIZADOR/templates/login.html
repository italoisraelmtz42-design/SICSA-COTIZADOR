<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión · {{ EMPRESA.nombre }} Cotizador</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/' ~ LOGO_ICONO) }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <style>
    :root {
      --rojo: {{ COLORES.acento }};
      --azul: {{ COLORES.principal_oscuro }};
      --azul-claro: {{ COLORES.principal }};
      --gris: {{ COLORES.texto_suave }};
      --borde: {{ COLORES.borde }};
      --texto: {{ COLORES.principal_oscuro }};
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--azul-claro), var(--azul));
      color: var(--texto);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card-login {
      background: white;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      text-align: center;
    }
    .logo-wrap {
      width: 100%; max-width: 260px; height: 86px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: 20px; margin: 0 0 4px; color: var(--azul); }
    .empresa { color: var(--gris); font-size: 14px; margin-bottom: 24px; }
    .flash {
      text-align: left; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
      font-size: 14px; display: flex; align-items: center; gap: 8px;
    }
    .flash-success { background: #E7F6EC; color: #067647; }
    .flash-danger { background: #FDEDEE; color: var(--rojo); }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--borde);
      border-radius: 10px; font-size: 15px; margin-bottom: 16px; text-align: center;
      letter-spacing: 2px;
    }
    input:focus { outline: none; border-color: var(--azul); }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: var(--rojo); color: white; font-size: 15px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <div class="card-login">
    <div class="logo-wrap">
      <img src="{{ url_for('static', filename='img/' ~ LOGO_COMPLETO) }}" alt="{{ EMPRESA.nombre }}">
    </div>
    <h1>{{ EMPRESA.razon_social or EMPRESA.nombre }}</h1>
    <div class="empresa">Acceso al sistema de cotizaciones</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}"><i class="ti ti-{{ 'check' if category == 'success' else 'alert-circle' }}"></i>{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="password" name="password" placeholder="Contraseña" autofocus required>
      <button type="submit"><i class="ti ti-login-2"></i>Entrar</button>
    </form>
  </div>
</body>
</html>
